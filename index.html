<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://generativelanguage.googleapis.com https://api.deepseek.com; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miu — Trợ lý AI</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b1625">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Miu">
<style>
  :root{
    --bg: #f7f3f8;
    --bg-glow: #ece0f0;
    --bg-soft: #ece4ef;
    --bubble-miu: #efe6f3;
    --bubble-user: #ff8fa3;
    --text: #2a1f33;
    --text-dim: #7a6f88;
    --accent: #d6557a;
    --accent-dim: #c76a84;
    --danger: #e0657a;
    --radius: 18px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1625; --bg-glow: #2a2140; --bg-soft: #241d33;
      --bubble-miu: #2c2440; --bubble-user: #ff8fa3;
      --text: #f4eee7; --text-dim: #b8aec8;
      --accent: #ff8fa3; --accent-dim: #c76a84;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1625; --bg-glow: #2a2140; --bg-soft: #241d33;
    --bubble-miu: #2c2440; --bubble-user: #ff8fa3;
    --text: #f4eee7; --text-dim: #b8aec8;
    --accent: #ff8fa3; --accent-dim: #c76a84;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    display:flex; flex-direction:column; height:100%;
    overflow:hidden;
  }
  header{
    padding:14px 18px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
    flex-shrink:0;
  }
  header h1{font-size:18px; margin:0; font-weight:600;}
  header p{margin:0; font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .header-text{flex:1; min-width:0;}
  
  /* Nút trên Header */
  .gear, .icon-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:20px; padding:6px; border-radius:50%; transition:0.2s;
  }
  .gear:hover, .icon-btn:hover{color:var(--text); background:rgba(255,255,255,.06);}
  .deep-btn.active{color:var(--accent); background:rgba(255,143,163,.22);}
  .live-btn.active{color:var(--accent); animation:live-pulse 1.4s ease-in-out infinite;}
  @keyframes live-pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,143,163,.45); }
    50%{ box-shadow:0 0 0 8px rgba(255,143,163,0); }
  }

  /* Settings & Forms */
  #settings{
    display:none; padding:14px 18px; background:var(--bg-soft);
    border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;
    max-height: 65vh; overflow-y: auto;
  }
  #settings.open{display:block;}
  #settings label{font-size:12px; color:var(--text-dim); display:block; margin:12px 0 6px;}
  #settings .row{display:flex; gap:8px;}
  #settings input, #settings select{
    flex:1; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:var(--bg); color:var(--text); font-size:13px;
  }
  #settings button{
    padding:9px 14px; border-radius:10px; border:none; background:var(--accent);
    color:#1b1625; font-weight:600; cursor:pointer; font-size:13px;
  }
  #settings .hint{font-size:11px; color:var(--text-dim); margin-top:8px; line-height:1.5;}
  #settings .danger{background:var(--danger); color:#fff; margin-top:12px; width:100%;}
  
  .acct-box{background:var(--bg); padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.1); margin-bottom:12px;}
  .acct-box h3{margin:0 0 8px; font-size:14px;}
  
  /* Khu vực Chat */
  #chat{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;}
  
  .bubble-wrap{display:flex; flex-direction:column; max-width:80%; align-self:flex-start;}
  .bubble-wrap.user{align-self:flex-end; align-items:flex-end;}
  
  .bubble{
    padding:10px 14px; border-radius:var(--radius); font-size:14.5px;
    line-height:1.45; white-space:pre-wrap; word-wrap:break-word; position:relative; width:100%;
  }
  .bubble.miu{background:var(--bubble-miu); color:var(--text); border-bottom-left-radius:4px;}
  .bubble.user{background:var(--bubble-user); color:#2a1620; border-bottom-right-radius:4px;}
  .bubble.typing{color:var(--text-dim); font-style:italic;}
  
  /* Nút Copy tin nhắn */
  .msg-actions{display:flex; gap:8px; margin-top:4px; opacity:0; transition:0.2s;}
  .bubble-wrap:hover .msg-actions{opacity:1;}
  .copy-btn{background:none; border:none; font-size:11px; color:var(--text-dim); cursor:pointer; padding:2px 4px;}
  .copy-btn:hover{color:var(--accent);}

  .bubble img.thumb{display:block; max-width:100%; max-height:180px; border-radius:10px; margin-top:6px;}
  .sources{margin-top:8px; font-size:12px; color:var(--text-dim); line-height:1.7;}
  .sources a{color:var(--accent);}

  /* Thanh nhập liệu */
  footer{
    padding:12px 14px; display:flex; gap:8px; border-top:1px solid rgba(255,255,255,.07);
    flex-shrink:0; background:var(--bg);
  }
  #input{
    flex:1; min-width:0; padding:12px 16px; border-radius:22px; border:1px solid rgba(255,255,255,.12);
    background:var(--bg-soft); color:var(--text); font-size:14.5px; outline:none;
  }
  #input:focus{border-color:var(--accent);}
  #send{
    width:44px; height:44px; border-radius:50%; border:none; background:var(--accent);
    color:#1b1625; font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .bar-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:20px; width:38px; height:44px; border-radius:50%; flex-shrink:0; padding:0;
  }

  /* Sidebar (Drawer) */
  #drawerMask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;}
  #drawerMask.open{display:block;}
  #drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(84vw, 330px); z-index:50;
    background:var(--bg-soft); color:var(--text); display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform:translateX(-102%); transition:transform .2s ease; box-shadow:4px 0 24px rgba(0,0,0,.35);
  }
  #drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:16px;}
  .drawer-head button{background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:6px;}
  .new-chat{width:100%; padding:12px; border-radius:12px; border:none; background:var(--accent); color:#1b1625; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:12px;}
  #chatList{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .chat-item{display:flex; align-items:center; border-radius:12px; background:var(--bg);}
  .chat-item.active{outline:2px solid var(--accent);}
  .chat-title{flex:1; min-width:0; padding:12px; font-size:14px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chat-item button{background:none; border:none; font-size:16px; padding:10px; cursor:pointer; color:var(--text-dim);}

  #attachBar{display:none; gap:8px; flex-wrap:wrap; padding:8px 14px 0; background:var(--bg); flex-shrink:0;}
  #attachBar.has{display:flex;}
  .chip{display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:12px; background:var(--bg-soft); color:var(--text); font-size:12px;}
  .chip img{width:32px; height:32px; object-fit:cover; border-radius:6px;}
  .chip span{max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:0 2px;}

  #chat::-webkit-scrollbar{width:6px;}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:4px;}
</style>
</head>
<body>

<header>
  <button class="icon-btn gear" id="menuBtn" title="Danh sách chat">☰</button>
  <div class="header-text">
    <h1>🐾 Miu</h1>
    <p id="chatTitle">Chat mới</p>
  </div>
  <button class="icon-btn" id="deleteCurrentBtn" title="Xóa đoạn chat này">🗑️</button>
  <button class="icon-btn gear" id="newBtn" title="Chat mới">＋</button>
  <button class="icon-btn deep-btn" id="deepBtn" title="Suy nghĩ sâu (trả lời kỹ hơn)">🧠</button>
  <button class="icon-btn live-btn" id="liveBtn" title="Chế độ live (nói chuyện bằng giọng nói)">🎙️</button>
  <button class="icon-btn gear" id="gearBtn" title="Cài đặt">⚙</button>
</header>

<div id="settings">
  <div class="acct-box" id="accountBox"></div>
  
  <label for="providerSelect">Chọn AI để Miu trò chuyện</label>
  <div class="row">
    <select id="providerSelect">
      <option value="gemini">Gemini (Google)</option>
      <option value="deepseek">DeepSeek</option>
    </select>
  </div>
  
  <label for="apiKeyInput">Gemini API Key (lưu cục bộ)</label>
  <div class="row">
    <input type="password" id="apiKeyInput" placeholder="Dán Gemini API key..." autocomplete="off" spellcheck="false">
    <button id="saveKeyBtn">Lưu</button>
  </div>
  
  <label for="deepseekKeyInput">DeepSeek API Key (lưu cục bộ)</label>
  <div class="row">
    <input type="password" id="deepseekKeyInput" placeholder="Dán DeepSeek API key..." autocomplete="off" spellcheck="false">
    <button id="saveDeepseekBtn">Lưu</button>
  </div>
  
  <div class="hint">
    Gemini: lấy key tại aistudio.google.com. DeepSeek: lấy key tại platform.deepseek.com. Gõ "help" trong khung chat để xem lệnh offline.
  </div>
  
  <div class="row"><button class="danger" id="clearDataBtn">Xoá toàn bộ dữ liệu App</button></div>
</div>

<div id="chat"></div>
<div id="attachBar"></div>

<footer>
  <button class="bar-btn" id="attachBtn" title="Đính kèm tệp/ảnh">📎</button>
  <button class="bar-btn" id="camBtn" title="Chụp ảnh">📷</button>
  <input id="input" type="text" placeholder="Nhắn gì đó cho Miu..." autocomplete="off">
  <button id="send">➤</button>
</footer>

<input type="file" id="fileInput" multiple hidden accept="image/*,application/pdf,text/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.xml,.log,.yml,.yaml">
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<div id="drawerMask"></div>
<aside id="drawer">
  <div class="drawer-head"><strong>Cuộc trò chuyện</strong><button id="drawerClose">✕</button></div>
  <button class="new-chat" id="newChatBtn">＋ Chat mới</button>
  <div id="chatList"></div>
</aside>

<script>
// ============================================================================
// 1. DOM ELEMENTS
// ============================================================================
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const gearBtn = document.getElementById('gearBtn');
const liveBtn = document.getElementById('liveBtn');
const deepBtn = document.getElementById('deepBtn');
const settingsEl = document.getElementById('settings');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const providerSelect = document.getElementById('providerSelect');
const deepseekKeyInput = document.getElementById('deepseekKeyInput');
const saveDeepseekBtn = document.getElementById('saveDeepseekBtn');
const attachBtn = document.getElementById('attachBtn');
const camBtn = document.getElementById('camBtn');
const fileInput = document.getElementById('fileInput');
const camInput = document.getElementById('camInput');
const attachBar = document.getElementById('attachBar');
const menuBtn = document.getElementById('menuBtn');
const newBtn = document.getElementById('newBtn');
const deleteCurrentBtn = document.getElementById('deleteCurrentBtn');
const drawer = document.getElementById('drawer');
const drawerMask = document.getElementById('drawerMask');
const drawerClose = document.getElementById('drawerClose');
const newChatBtn = document.getElementById('newChatBtn');
const chatListEl = document.getElementById('chatList');
const chatTitleEl = document.getElementById('chatTitle');
const accountBox = document.getElementById('accountBox');
const clearDataBtn = document.getElementById('clearDataBtn');

const GEMINI_MODEL = "gemini-1.5-flash";
const DEEPSEEK_MODEL = "deepseek-chat";
const DEEP_HINT = " CHẾ ĐỘ SUY NGHĨ SÂU: Hãy suy nghĩ kỹ trước khi trả lời, trả lời đầy đủ, mạch lạc, có cấu trúc (có thể dài hơn bình thường), ưu tiên thông tin chính xác. Nếu không chắc thì nói rõ.";
const SYSTEM_PERSONA = "Bạn là Miu, một trợ lý AI cá nhân nói tiếng Việt, thân thiện, ấm áp, hay dùng từ 'mình' để xưng hô và gọi người dùng là 'bạn', không bao giờ gọi người dùng là 'mày'. Trả lời ngắn gọn, tự nhiên, gần gũi, có thể dùng vài icon ✨🐾 cho vui nhưng đừng lạm dụng. Trả lời bằng tiếng Việt có dấu đầy đủ.";
const GREETING = "Chào bạn! Mình là Miu 🐾 Gõ \"help\" để xem mình làm được gì nhé.";

// ============================================================================
// 2. LƯU TRỮ & ĐĂNG NHẬP CỤC BỘ (LOCAL AUTH)
// ============================================================================
const Store = {
  prefix: 'miu_guest_',
  KEYS: ['api_key', 'deepseek_key', 'provider', 'deep', 'chats', 'current'],
  setPrefix(p){ this.prefix = p; },
  getRaw(full){ try { return localStorage.getItem(full); } catch (e) { return null; } },
  setRaw(full, v){ try { localStorage.setItem(full, String(v)); return true; } catch (e) { return false; } },
  removeRaw(full){ try { localStorage.removeItem(full); } catch (e) {} },
  getRawJSON(full, fb){ const v = this.getRaw(full); if (v === null) return fb; try { return JSON.parse(v); } catch (e) { return fb; } },
  setRawJSON(full, obj){ return this.setRaw(full, JSON.stringify(obj)); },
  get(name, fb = null){ const v = this.getRaw(this.prefix + name); return v === null ? fb : v; },
  set(name, v){ return this.setRaw(this.prefix + name, v); },
  remove(name){ this.removeRaw(this.prefix + name); },
  getJSON(name, fb){ return this.getRawJSON(this.prefix + name, fb); },
  setJSON(name, obj){ return this.setRawJSON(this.prefix + name, obj); },
  clearAll(){ this.KEYS.forEach(k => this.remove(k)); },
};

const Auth = {
  currentUser: null,
  init() {
    this.currentUser = Store.getRawJSON('miu_local_auth', null);
    if (this.currentUser && this.currentUser.username) {
      Store.setPrefix('miu_user_' + this.currentUser.username + '_');
    } else {
      Store.setPrefix('miu_guest_');
    }
  },
  login(username, pin) {
    if (!username || !pin) return "Vui lòng nhập đủ Tên và Mã PIN.";
    const users = Store.getRawJSON('miu_all_users', {});
    if (users[username] && users[username] !== pin) return "Mã PIN không đúng!";
    users[username] = pin;
    Store.setRawJSON('miu_all_users', users);
    Store.setRawJSON('miu_local_auth', { username: username });
    location.reload();
  },
  logout() {
    Store.removeRaw('miu_local_auth');
    location.reload();
  }
};

Auth.init();

// ============================================================================
// 3. QUẢN LÝ CHAT & GIAO DIỆN CHAT
// ============================================================================
const MAX_CHATS = 50;
let chats = {};
let currentId = null;
let history = [];
let busy = false;
let busySince = 0;
const isBusy = () => busy && (Date.now() - busySince) < 120000;
let liveActive = false;
let waitingForReply = false;
let recognition = null;
let attachments = [];

let apiKey = Store.get('api_key', '');
let deepseekKey = Store.get('deepseek_key', '');
let deepMode = Store.get('deep') === '1';
let provider = Store.get('provider', 'gemini');

apiKeyInput.value = apiKey;
deepseekKeyInput.value = deepseekKey;
providerSelect.value = provider;
deepBtn.classList.toggle('active', deepMode);

function makeTitle(text){
  let t = String(text).split('\n')[0].replace(/^📎\s*/, '').trim();
  if (!t) t = 'Chat mới';
  return t.length > 30 ? t.slice(0, 30).trimEnd() + '…' : t;
}
function newChatObj(){
  const id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
  return { id, title: null, history: [{ who: 'miu', text: GREETING }], updated: Date.now() };
}
function persistChats(){
  const out = {};
  Object.values(chats).forEach(c => {
    out[c.id] = { id: c.id, title: c.title, updated: c.updated, history: c.history.slice(-60) };
  });
  Store.setJSON('chats', out);
  Store.set('current', currentId);
}
function loadChats(){
  const saved = Store.getJSON('chats', null);
  if (saved && Object.keys(saved).length){
    chats = saved;
    currentId = Store.get('current');
    if (!chats[currentId]) currentId = Object.values(chats).sort((a, b) => b.updated - a.updated)[0].id;
  } else {
    const c = newChatObj();
    chats[c.id] = c; currentId = c.id;
  }
  history = chats[currentId].history;
  persistChats();
}
function saveHistory(){
  if (chats[currentId]) chats[currentId].updated = Date.now();
  persistChats();
}
function updateTitleUI(){
  chatTitleEl.textContent = (chats[currentId] && chats[currentId].title) || 'Chat mới';
}

function addBubble(text, who, store = true){
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap ' + who;
  
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  wrap.appendChild(div);

  // Nút Copy cho tin nhắn của Miu
  if (who === 'miu' && !text.includes("đang gõ") && !text.includes("suy nghĩ sâu")) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = '📋 Copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '✅ Đã chép';
        setTimeout(() => copyBtn.textContent = '📋 Copy', 2000);
      });
    };
    actions.appendChild(copyBtn);
    wrap.appendChild(actions);
  }

  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;

  if (store){
    history.push({who, text});
    const cur = chats[currentId];
    if (who === 'user' && cur && !cur.title){
      cur.title = makeTitle(text);
      updateTitleUI();
    }
    saveHistory();
  }
  
  if (who === 'miu' && liveActive && !text.includes("đang gõ") && !text.includes("suy nghĩ sâu")){
    waitingForReply = false;
    speakText(text);
  }
  return wrap;
}

function renderChat(){
  const was = liveActive;
  liveActive = false; 
  chatEl.textContent = '';
  history.forEach(m => addBubble(m.text, m.who, false));
  liveActive = was;
  chatEl.scrollTop = chatEl.scrollHeight;
  updateTitleUI();
}

function renderChatList(){
  chatListEl.textContent = '';
  Object.values(chats).sort((a, b) => b.updated - a.updated).forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat-item' + (c.id === currentId ? ' active' : '');
    const t = document.createElement('span');
    t.className = 'chat-title';
    t.textContent = c.title || 'Chat mới';
    t.onclick = () => switchChat(c.id);
    const d = document.createElement('button');
    d.textContent = '🗑';
    d.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    row.appendChild(t); row.appendChild(d); chatListEl.appendChild(row);
  });
}
function openDrawer(){ renderChatList(); drawer.classList.add('open'); drawerMask.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); drawerMask.classList.remove('open'); }
function warnBusy(){ closeDrawer(); addBubble("Miu đang trả lời, bạn chờ xíu rồi chuyển chat nhé.", "miu", false); }
function switchChat(id){
  if (id === currentId){ closeDrawer(); return; }
  if (isBusy()){ warnBusy(); return; }
  currentId = id;
  history = chats[id].history;
  persistChats(); renderChat(); closeDrawer();
}
function newChat(){
  if (isBusy()){ warnBusy(); return; }
  closeDrawer();
  const cur = chats[currentId];
  if (cur && !cur.history.some(m => m.who === 'user')) return;
  const oldest = Object.values(chats).filter(c => c.id !== currentId).sort((a, b) => a.updated - b.updated);
  while (Object.keys(chats).length >= MAX_CHATS && oldest.length) delete chats[oldest.shift().id];
  const c = newChatObj();
  chats[c.id] = c; currentId = c.id; history = c.history; persistChats(); renderChat();
}
function deleteChat(id){
  if (isBusy()){ warnBusy(); return; }

<script>

function generatePassword(length){
  length = Math.max(6, Math.min(length || 12, 64));
  const lower = "abcdefghijklmnopqrstuvwxyz";
  const upper = lower.toUpperCase();
  const digits = "0123456789";
  const symbols = "!@#$%^&*()-_=+";
  const all = lower + upper + digits + symbols;
  function pick(set){ return set[crypto.getRandomValues(new Uint32Array(1))[0] % set.length]; }
  let pass = [pick(lower), pick(upper), pick(digits)];
  while (pass.length < length) pass.push(pick(all));
  for (let i = pass.length - 1; i > 0; i--){
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [pass[i], pass[j]] = [pass[j], pass[i]];
  }
  return pass.join('');
}

let countdownTimer = null;
function startCountdown(seconds){
  seconds = Math.max(1, Math.min(seconds || 10, 300));
  if (countdownTimer) clearInterval(countdownTimer);
  addBubble(`Đếm ngược ${seconds} giây nhé!`, "miu");
  let n = seconds;
  countdownTimer = setInterval(() => {
    addBubble(String(n), "miu");
    n--;
    if (n < 0){
      clearInterval(countdownTimer); countdownTimer = null;
      addBubble("Hết giờ rồi! ⏰", "miu");
    }
  }, 1000);
}

function stripDiacritics(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
}

// --- Game 4: Đoán con vật ---
const ANIMALS = [
  {ten:"cho", goiY:["La ban than lau doi nhat cua con nguoi.","Hay vay duoi khi vui, biet giu nha.","Keu 'gau gau'."]},
  {ten:"meo", goiY:["Thich nam sap va rinh chuot.","Rat sach se, hay tu liem long.","Keu 'meo meo'."]},
  {ten:"voi", goiY:["La dong vat tren can lon nhat con song.","Co cai voi dai dung de hut nuoc, boc thuc an.","Doi tai to nhu 2 canh quat."]},
  {ten:"huou cao co", goiY:["La con vat cao nhat the gioi.","Co cai co rat dai de an la tren cao.","Song chu yeu o thao nguyen chau Phi."]},
  {ten:"su tu", goiY:["Duoc menh danh la chua te son lam.","Con duc co bom toc quanh co rat oai ve.","Song thanh dan, san moi theo nhom."]},
  {ten:"ca voi", goiY:["La dong vat lon nhat hanh tinh, song duoi bien.","La dong vat co vu, phai ngoi len mat nuoc de tho.","Mot so loai hat rat hay, gan giong 'ca hat'."]},
  {ten:"khi", goiY:["Rat thich an chuoi.","Leo treo rat gioi, hay bat chuoc dong tac con nguoi.","La ho hang gan voi loai nguoi trong tu nhien."]},
  {ten:"ga", goiY:["Gay bao thuc moi buoi sang som.","De trung, la mon an quen thuoc.","Keu 'o o o o o'."]},
  {ten:"rua", goiY:["Di rat cham nhung song rat tho.","Co the rut dau va chan vao trong mai khi so hai.","Trong truyen ngu ngon, thang cuoc thi voi tho."]},
  {ten:"ca sau", goiY:["Song ca duoi nuoc lan tren can, ham rang rat sac.","Hay nam bat dong nhu khuc go de rinh moi.","La mot trong nhung loai bo sat lon nhat con song."]},
];
let animalGame = { active:false, answer:null, hints:[], hintIndex:0, attempts:0 };

function animalStart(){
  const animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  animalGame = { active:true, answer:animal.ten, hints:animal.goiY, hintIndex:1, attempts:0 };
  addBubble(`Mình đang nghĩ đến 1 con vật, đoán xem là con gì nhé!\nGợi ý 1: ${animalGame.hints[0]}\n(Gõ "thoat game 4" để dừng chơi)`, "miu");
}
function animalGuess(raw){
  animalGame.attempts++;
  const guessNorm = stripDiacritics(raw.toLowerCase().trim());
  const answerNorm = stripDiacritics(animalGame.answer.toLowerCase());
  if (guessNorm === answerNorm){
    addBubble(`Chính xác! Đó là con ${animalGame.answer}. Bạn đoán đúng sau ${animalGame.attempts} lần!`, "miu");
    animalGame = { active:false, answer:null, hints:[], hintIndex:0, attempts:0 };
    return;
  }
  if (animalGame.hintIndex < animalGame.hints.length){
    const hint = animalGame.hints[animalGame.hintIndex];
    animalGame.hintIndex++;
    addBubble(`Chưa đúng rồi. Gợi ý ${animalGame.hintIndex}: ${hint}`, "miu");
    return;
  }
  addBubble(`Hết gợi ý rồi, đáp án là con ${animalGame.answer}.`, "miu");
  animalGame = { active:false, answer:null, hints:[], hintIndex:0, attempts:0 };
}
function animalStop(){
  if (!animalGame.active){ addBubble("Đâu có đang chơi đoán con vật nào cả.", "miu"); return; }
  const answer = animalGame.answer;
  animalGame = { active:false, answer:null, hints:[], hintIndex:0, attempts:0 };
  addBubble(`Đã dừng chơi. Đáp án là con ${answer}.`, "miu");
}

// --- Game 5: Nối từ ---
const WORDCHAIN_WORDS = ["an", "anh", "ao", "ba", "banh", "bo", "buom", "ca", "canh", "cam", "cao", "cho", "com", "da", "dau", "de", "dua", "em", "en", "ga", "gao", "gau", "gio", "ho", "hoa", "hoc", "im", "it", "keo", "khe", "khoa", "la", "lop", "lua", "meo", "mit", "mua", "nai", "nam", "nang", "nem", "no", "oc", "oi", "ong", "phao", "pho", "phu", "quat", "qua", "quen", "ran", "rau", "re", "sao", "sen", "sung", "suoi", "tam", "tao", "tho", "tom", "tra", "tre", "tu", "uot", "uyen", "vang", "vit", "vo", "xanh", "xe", "xoi", "y", "yeu"];
let wordChainGame = { active:false, used:new Set(), lastLetter:null };

function wcFindContinuation(letter){
  const candidates = WORDCHAIN_WORDS.filter(w => {
    const n = stripDiacritics(w).toLowerCase();
    return n[0] === letter && !wordChainGame.used.has(n);
  });
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}
function wordchainStart(){
  const first = WORDCHAIN_WORDS[Math.floor(Math.random() * WORDCHAIN_WORDS.length)];
  const norm = stripDiacritics(first).toLowerCase();
  wordChainGame = { active:true, used:new Set([norm]), lastLetter: norm.slice(-1) };
  addBubble(`Chơi nối từ nhé! Mình đi trước: "${first}".\nBạn nói 1 từ (không dấu cách) bắt đầu bằng chữ "${wordChainGame.lastLetter}" đi! (Gõ "thoat game 5" để dừng chơi)`, "miu");
}
function wordchainGuess(raw){
  const word = raw.trim();
  if (!word || word.includes(' ')){ addBubble(`Bạn gõ 1 từ duy nhất thôi nhé, bắt đầu bằng chữ "${wordChainGame.lastLetter}".`, "miu"); return; }
  const norm = stripDiacritics(word.toLowerCase());
  if (norm[0] !== wordChainGame.lastLetter){
    wordChainGame.active = false; addBubble(`Từ phải bắt đầu bằng chữ "${wordChainGame.lastLetter}" chứ! Bạn thua rồi, gõ "game 5" để chơi lại nhé.`, "miu"); return;
  }
  if (wordChainGame.used.has(norm)){
    wordChainGame.active = false; addBubble(`Từ "${word}" dùng rồi nè, bạn thua rồi! Gõ "game 5" để chơi lại.`, "miu"); return;
  }
  wordChainGame.used.add(norm);
  const nextLetter = norm.slice(-1);
  const continuation = wcFindContinuation(nextLetter);
  if (!continuation){
    wordChainGame.active = false; addBubble(`Mình chịu thua, không nghĩ ra từ nào bắt đầu bằng chữ "${nextLetter}" nữa! Bạn thắng!`, "miu"); return;
  }
  wordChainGame.used.add(stripDiacritics(continuation).toLowerCase());
  wordChainGame.lastLetter = stripDiacritics(continuation).toLowerCase().slice(-1);
  addBubble(`"${continuation}". Tới lượt bạn, từ bắt đầu bằng chữ "${wordChainGame.lastLetter}" nhé!`, "miu");
}
function wordchainStop(){
  if (!wordChainGame.active){ addBubble("Đâu có đang chơi nối từ đâu.", "miu"); return; }
  wordChainGame.active = false; addBubble("Đã dừng chơi nối từ.", "miu");
}

// --- Nhắc uống nước ---
let waterTimer = null;
function startWaterReminder(text){
  const match = text.match(/\d+/);

  waterTimer = setInterval(() => { addBubble("Uống nước đi bạn ơi! 💧 Giữ sức khỏe nhé.", "miu"); }, minutes * 60 * 1000);
}
function stopWaterReminder(){
  if (!waterTimer){ addBubble("Hiện tại chưa bật nhắc uống nước mà.", "miu"); return; }
  clearInterval(waterTimer); waterTimer = null; addBubble("Đã tắt nhắc uống nước.", "miu");
}

// --- Xử lý lệnh ---
const has = (t, ...keys) => keys.some(k => t.includes(k));
const firstNumber = (t, fallback) => { const m = t.match(/\d+/); return m ? parseInt(m[0], 10) : fallback; };

const HELP_TEXT = `Mình làm được (offline):
- "tao mat khau [so ky tu]"
- "dem nguoc [so giay]"
- "game 4" (doan con vat)
- "game 5" (noi tu)
- "nhac uong nuoc [so phut]"
- "tat nhac uong nuoc"
- Nút ⚙ — Đăng nhập/Tạo tài khoản để lưu dữ liệu riêng.
- Gõ "help" để xem lại.`;

const COMMANDS = [
  { match: t => t === 'help' || t === 'tro giup', run: () => addBubble(HELP_TEXT, "miu") },
  { match: t => has(t, 'tao mat khau', 'sinh mat khau'), run: t => { const len = firstNumber(t, 12); addBubble(`Mật khẩu ${len} ký tự của bạn:\n${generatePassword(len)}`, "miu"); } },
  { match: t => has(t, 'dem nguoc'), run: t => startCountdown(firstNumber(t, 10)) },
  { match: t => has(t, 'tat nhac uong nuoc', 'dung nhac uong nuoc', 'thoat nhac uong nuoc'), run: () => stopWaterReminder() },
  { match: t => has(t, 'nhac uong nuoc', 'bat nhac uong nuoc'), run: t => startWaterReminder(t) },
  { match: t => has(t, 'thoat game 4', 'dung game 4', 'huy game 4'), run: () => animalStop() },
  { match: t => has(t, 'game 4', 'doan con vat'), run: () => animalStart() },
  { match: t => has(t, 'thoat game 5', 'dung game 5', 'huy game 5'), run: () => wordchainStop() },
  { match: t => has(t, 'game 5', 'noi tu'), run: () => wordchainStart() },
];
function handleLocalCommand(raw){
  const text = stripDiacritics(raw.toLowerCase()).trim();
  const cmd = COMMANDS.find(c => c.match(text));
  if (!cmd) return false;
  cmd.run(text); return true;
}

// ============================================================================
// 6. ĐÍNH KÈM TỆP / ẢNH

const MAX_ATTACH = 4;
const TEXT_EXTS = ['txt','md','csv','json','js','ts','py','html','css','xml','log','yml','yaml','java','c','cpp','h','sh','sql','ini','tsv'];

function readAsBase64(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); }); }
function readAsText(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(file); }); }

function loadImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: dataUrl.split(',')[1], thumb: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

function renderAttachments(){
  attachBar.textContent = ''; attachBar.classList.toggle('has', attachments.length > 0);
  attachments.forEach((a, i) => {
    const chip = document.createElement('div'); chip.className = 'chip';
    if (a.thumb) { const im = document.createElement('img'); im.src = a.thumb; chip.appendChild(im); }
    else { const ic = document.createElement('div'); ic.textContent = a.kind === 'pdf' ? '📕' : '📄'; chip.appendChild(ic); }
    const nm = document.createElement('span'); nm.textContent = a.name; chip.appendChild(nm);
    const x = document.createElement('button'); x.textContent = '✕'; x.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    chip.appendChild(x); attachBar.appendChild(chip);
  });
}

async function addFiles(fileList){
  for (const file of Array.from(fileList)){
    if (attachments.length >= MAX_ATTACH){ addBubble(`Mỗi lần mình chỉ nhận tối đa ${MAX_ATTACH} tệp thôi nhé.`, "miu", false); break; }
    const name = file.name || 'tep'; const ext = (name.split('.').pop() || '').toLowerCase();
    try {
      if (file.type.startsWith('image/')){
        const img = await loadImage(file); attachments.push({ name, kind:'image', mime:img.mime, data:img.data, thumb:img.thumb });
      } else if (file.type === 'application/pdf' || ext === 'pdf'){
        if (file.size > 10 * 1024 * 1024){ addBubble(`Tệp PDF "${name}" lớn quá (trên 10MB).`, "miu", false); continue; }
        attachments.push({ name, kind:'pdf', mime:'application/pdf', data: await readAsBase64(file) });
      } else if (file.type.startsWith('text/') || TEXT_EXTS.includes(ext)){
        let t = await readAsText(file); if (t.length > 60000) t = t.slice(0, 60000) + '\n...(đã cắt bớt)';
        attachments.push({ name, kind:'text', text:t });
      } else {
        addBubble(`Mình chưa đọc được loại tệp "${name}".`, "miu", false);
      }
    } catch (e){ addBubble(`Không đọc được tệp "${name}".`, "miu", false); }
  }
  renderAttachments();
}
attachBtn.onclick = () => fileInput.click(); camBtn.onclick = () => camInput.click();
fileInput.onchange = async (e) => { await addFiles(e.target.files); e.target.value = ''; };
camInput.onchange = async (e) => { await addFiles(e.target.files); e.target.value = ''; };

// 7. GỌI API (GEMINI & DEEPSEEK)
// ============================================================================
function historyForModel(){
  const h = history.filter(m => m.who === 'user' || m.who === 'miu').slice(-13);
  if (h.length && h[h.length - 1].who === 'user') h.pop();
  return h.slice(-12);
}
function attachedTextBlock(atts){ return atts.filter(a => a.kind === 'text').map(a => `\n\n[Tệp ${a.name}]\n${a.text}`).join(''); }
const thinkingText = () => deepMode ? "Miu đang suy nghĩ sâu..." : "Miu đang gõ...";
class ProviderError extends Error { constructor(m){ super(m); this.userMessage = m; } }
const safeHttpUrl = (u) => typeof u === 'string' && /^https?:\/\//i.test(u);

async function geminiFetch(body){
  const base = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  let res, data;
  for (let attempt = 0; attempt < 3; attempt++){
    try { res = await fetch(base + '?key=' + encodeURIComponent(apiKey), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
    catch(e) { throw new ProviderError("Lỗi mạng không thể gọi Gemini."); }
    data = await res.json().catch(() => ({}));
    if (res.status !== 503 && res.status !== 429) break;
    await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
  }
  return { res, data };
}

const GeminiProvider = {
  async ask(userText, atts){
    if (!apiKey) throw new ProviderError("Bạn chưa lưu Gemini API key (bấm ⚙ góc trên để thêm).");
    const parts = [{ text: userText + attachedTextBlock(atts) }];
    atts.forEach(a => { if (a.kind === 'image' || a.kind === 'pdf') parts.push({ inlineData: { mimeType: a.mime, data: a.data } }); });
    const contents = historyForModel().map(m => ({ role: m.who === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
    contents.push({ role: 'user', parts });
    const baseBody = { contents, systemInstruction: { parts: [{ text: SYSTEM_PERSONA + (deepMode ? DEEP_HINT : '') }] } };
    
    const variants = deepMode ? [{ search: true, think: { thinkingLevel: 'high' } }, { search: true, think: null }, { search: false, think: null }] : [{ search: false, think: null }];
    let result = null;
    for (const v of variants){
      const body = Object.assign({}, baseBody);
      if (v.search) body.tools = [{ google_search: {} }];
      if (v.think) body.generationConfig = { thinkingConfig: v.think };
      result = await geminiFetch(body);
      if (result.res.status !== 400) break;
    }
    const { res, data } = result;
    if (!res.ok) throw new ProviderError(`Lỗi Gemini (${res.status}): ${data?.error?.message || 'Không rõ nguyên nhân'}`);
    const cand = data?.candidates?.[0];
    const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('') || "Mình chưa nghĩ ra câu trả lời.";
    const seen = new Set();
    const sources = (cand?.groundingMetadata?.groundingChunks || []).map(c => c.web).filter(w => w && safeHttpUrl(w.uri) && !seen.has(w.uri) && seen.add(w.uri)).slice(0, 5);
    return { text, sources };
  }
};

const DeepseekProvider = {
  async ask(userText, atts){
    if (!deepseekKey) throw new ProviderError("Bạn chưa lưu DeepSeek API key.");
    if (atts.some(a => a.kind !== 'text')) throw new ProviderError("DeepSeek chưa đọc được ảnh hoặc PDF. Bạn chọn Gemini nhé.");
    const sys = SYSTEM_PERSONA + (deepMode ? DEEP_HINT : '');
    const messages = [{ role: 'system', content: sys }]
      .concat(historyForModel().map(m => ({ role: m.who === 'user' ? 'user' : 'assistant', content: m.text })))
      .concat([{ role: 'user', content: userText + attachedTextBlock(atts) }]);
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + deepseekKey },
      body: JSON.stringify({ model: DEEPSEEK_MODEL, messages, thinking: { type: deepMode ? 'enabled' : 'disabled' }, stream: false })
    });
    const data = await res.json();
    if (!res.ok) throw new ProviderError(`Lỗi DeepSeek (${res.status}): ${data?.error?.message || 'Lỗi không xác định'}`);
    return { text: data?.choices?.[0]?.message?.content || "Không có phản hồi.", sources: [] };
  }
};
const Providers = { gemini: GeminiProvider, deepseek: DeepseekProvider };

async function askMiu(userText, atts = []){
  busy = true; busySince = Date.now();
  const prov = Providers[provider] || GeminiProvider;
  const thinking = addBubble(thinkingText(), "miu typing", false);
  try {
    const out = await prov.ask(userText, atts);
    thinking.remove();
    const bubble = addBubble(out.text, "miu");
    if (out.sources && out.sources.length){
      const box = document.createElement('div'); box.className = 'sources'; box.appendChild(document.createTextNode('Nguồn: '));
      out.sources.forEach((w, i) => {
        if (i) box.appendChild(document.createTextNode(' · '));
        const a = document.createElement('a'); a.href = w.uri; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = w.title || w.uri;
        box.appendChild(a);
      });
      bubble.appendChild(box);
    }
  } catch (err) {
    thinking.remove(); addBubble(err instanceof ProviderError ? err.userMessage : "Lỗi kết nối mạng hoặc máy chủ.", "miu");
  } finally { busy = false; }
}

// ============================================================================
// 8. ÂM THANH (MIC & TTS)
// ============================================================================
const RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
if (RecognitionCtor){
  recognition = new RecognitionCtor();
  recognition.lang = 'vi-VN'; recognition.continuous = false; recognition.interimResults = false;
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript.trim();
    if (transcript){ waitingForReply = true; inputEl.value = transcript; send(); }
  };
  recognition.onend = () => { if (liveActive && !waitingForReply && !speechSynthesis.speaking) startListening(); };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed'){
      liveActive = false; liveBtn.classList.remove('active');
      addBubble("Mình chưa được cấp quyền dùng micro, bạn cho phép rồi bật lại Live nhé.", "miu", false); return;
    }
    if (liveActive && !waitingForReply) setTimeout(() => startListening(), 500);
  };
}
function startListening(){ if (!recognition || !liveActive || waitingForReply) return; try { recognition.start(); } catch (e) {} }

function speakText(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const cleanText = text.replace(/[*#_`~]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'vi-VN';
  utter.onend = () => { if (liveActive) startListening(); };
  speechSynthesis.speak(utter);
}

liveBtn.onclick = () => {
  if (!recognition){ addBubble("Trình duyệt này chưa hỗ trợ live voice.", "miu", false); return; }
  liveActive = !liveActive; liveBtn.classList.toggle('active', liveActive);
  if (liveActive){ addBubble("Đã bật chế độ live, bạn nói chuyện thoải mái nhé! 🎙️", "miu", false); startListening(); }
  else { speechSynthesis.cancel(); if (recognition) { try { recognition.stop(); } catch(e){} } addBubble("Đã tắt chế độ live.", "miu", false); }
};

// ============================================================================
// 9. GỬI TIN NHẮN
// ============================================================================
function send(){
  const text = inputEl.value.trim(); const atts = attachments.slice();
  if (!text && !atts.length) return;

  if (atts.length){
    const shown = (text ? text + '\n' : '') + atts.map(a => '📎 ' + a.name).join('\n');
    const bubbleWrap = addBubble(shown, "user");
    atts.filter(a => a.thumb).forEach(a => { const im = document.createElement('img'); im.className = 'thumb'; im.src = a.thumb; bubbleWrap.querySelector('.bubble').appendChild(im); });
    inputEl.value = ''; attachments = []; renderAttachments();
    askMiu(text || 'Hãy xem tệp đính kèm này và cho mình biết nội dung chính nhé.', atts);
    return;
  }

  addBubble(text, "user"); inputEl.value = '';
  if (handleLocalCommand(text)) return;
  askMiu(text);
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
