<style>
  :root{
    --bg: #f7f3f8;
    --bg-glow: #ece0f0;
    --bg-soft: #ece4ef;
    --bubble-miu: #efe6f3;
    --bubble-user: #ff8fa3;
    --text: #2a1f33;
    --text-dim: #7a6f88;
    --accent: #d6557a;
    --accent-dim: #c76a84;
    --danger: #e0657a;
    --radius: 18px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1625; --bg-glow: #2a2140; --bg-soft: #241d33;
      --bubble-miu: #2c2440; --bubble-user: #ff8fa3;
      --text: #f4eee7; --text-dim: #b8aec8;
      --accent: #ff8fa3; --accent-dim: #c76a84;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1625; --bg-glow: #2a2140; --bg-soft: #241d33;
    --bubble-miu: #2c2440; --bubble-user: #ff8fa3;
    --text: #f4eee7; --text-dim: #b8aec8;
    --accent: #ff8fa3; --accent-dim: #c76a84;
    color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text);
    display:flex; flex-direction:column; height:100%;
    overflow:hidden;
  }
  header{
    padding:14px 18px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.07);
    flex-shrink:0;

  .paw{font-size:26px;}
  header h1{font-size:18px; margin:0; font-weight:600;}
  header p{margin:0; font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  header{gap:6px;}
  .header-text{flex:1; min-width:0;}
  .gear{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:20px; padding:6px; border-radius:50%;
  }
  .gear:hover{color:var(--text); background:rgba(255,255,255,.06);}
  .live-btn{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-size:18px; padding:6px; border-radius:50%;
  }
  .live-btn:hover{color:var(--text); background:rgba(255,255,255,.06);}
  .live-btn.active{color:var(--accent); animation:live-pulse 1.4s ease-in-out infinite;}

    0%,100%{ box-shadow:0 0 0 0 rgba(255,143,163,.45); }
    50%{ box-shadow:0 0 0 8px rgba(255,143,163,0); }
  }

  #settings{
    display:none; padding:14px 18px; background:var(--bg-soft);
    border-bottom:1px solid rgba(255,255,255,.07); flex-shrink:0;

  #settings.open{display:block;}
  #settings label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px;}
  #settings .row{display:flex; gap:8px;}
  #settings input{
    flex:1; padding:9px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.12);
    background:var(--bg); color:var(--text); font-size:13px;

  #settings button{

  #settings select{

  #settings .danger{background:var(--danger); color:#fff; margin-top:12px;}

  .acct small{display:block; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .deep-btn{

  .deep-btn:hover{color:var(--text); background:rgba(255,255,255,.06);}
  .deep-btn.active{color:var(--accent); background:rgba(255,143,163,.22);}

  #attachBar{
    display:none; gap:8px; flex-wrap:wrap; padding:8px 14px 0; flex-shrink:0; background:var(--bg);

  #attachBar.has{display:flex;}
  .chip{
    display:flex; align-items:center; gap:6px; max-width:100%; padding:4px 8px;

  .chip img{width:32px; height:32px; object-fit:cover; border-radius:6px;}

  .chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:0 2px;}
  .bubble img.thumb{display:block; max-width:100%; max-height:180px; border-radius:10px; margin-top:6px;}

  }

  #drawerMask{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  }
  #drawerMask.open{display:block;}
  #drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(84vw, 330px); z-index:50;
    background:var(--bg-soft); color:var(--text); display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform:translateX(-102%); transition:transform .2s ease; box-shadow:4px 0 24px rgba(0,0,0,.35);
  }
  #drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:16px;}
  .drawer-head button{background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; padding:6px;}
  .new-chat{
    width:100%; padding:12px; border-radius:12px; border:none; background:var(--accent);
    color:#1b1625; font-weight:700; font-size:14px; cursor:pointer; margin-bottom:12px;
  }
  #chatList{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
  .chat-item{display:flex; align-items:center; border-radius:12px; background:var(--bg);}
  .chat-item.active{outline:2px solid var(--accent);}
  .chat-title{flex:1; min-width:0; padding:12px; font-size:14px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chat-item button{background:none; border:none; font-size:16px; padding:10px; cursor:pointer; color:var(--text-dim);}

  #chat{
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:78%; padding:10px 14px; border-radius:var(--radius); font-size:14.5px;

  .bubble.miu{
    align-self:flex-start; background:var(--bubble-miu); color:var(--text);
    border-bottom-left-radius:4px;
  }
  .bubble.user{
    align-self:flex-end; background:var(--bubble-user); color:#2a1620;

  }
  .bubble.typing{color:var(--text-dim); font-style:italic;}

  footer{
    padding:12px 14px; display:flex; gap:8px; border-top:1px solid rgba(255,255,255,.07);
    flex-shrink:0; background:var(--bg);
  }
  #input{
    flex:1; min-width:0; padding:12px 16px; border-radius:22px; border:1px solid rgba(255,255,255,.12);
    background:var(--bg-soft); color:var(--text); font-size:14.5px; outline:none;
  }

  }

  #chat::-webkit-scrollbar{width:6px;}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:4px;}
</style>

<script>

const GEMINI_MODEL = "gemini-3.5-flash-lite";
const DEEPSEEK_MODEL = "deepseek-v4-flash";
const DEEP_HINT =
  " CHE DO SUY NGHI SAU: hay suy nghi ky truoc khi tra loi, tra loi day du, mach lac, " +
  "co cau truc (co the dai hon binh thuong), uu tien thong tin chinh xac va moi nhat, " +
  "neu khong chac thi noi ro la khong chac.";
const SYSTEM_PERSONA =
  "Ban la Miu, mot tro ly AI ca nhan noi tieng Viet, than thien, am ap, " +
  "hay dung tu 'minh' de xung ho va goi nguoi dung la 'ban', khong bao gio " +
  "goi nguoi dung la 'may'. Tra loi ngan gon, tu nhien, gan gui, co the " +
  "dung vai icon ✨🐾 cho vui nhung dung lam dung. Tra loi bang tieng Viet " +
  "co dau day du.";

// ---------------- Luu tru (Store): moi truy cap localStorage deu di qua day ----------------
// Khach giu tien to "miu_" (giong ten cu nen khong mat du lieu); moi tai khoan Google co tien to rieng.
const Store = {
  prefix: 'miu_',
  KEYS: ['api_key', 'deepseek_key', 'provider', 'deep', 'chats', 'current', 'history'],
  setPrefix(p){ this.prefix = p; },
  getRaw(full){ try { return localStorage.getItem(full); } catch (e) { return null; } },
  setRaw(full, v){ try { localStorage.setItem(full, String(v)); return true; } catch (e) { return false; } },
  removeRaw(full){ try { localStorage.removeItem(full); } catch (e) {} },
  getRawJSON(full, fb){ const v = this.getRaw(full); if (v === null) return fb; try { return JSON.parse(v); } catch (e) { return fb; } },
  setRawJSON(full, obj){ return this.setRaw(full, JSON.stringify(obj)); },
  get(name, fb = null){ const v = this.getRaw(this.prefix + name); return v === null ? fb : v; },
  set(name, v){ return this.setRaw(this.prefix + name, v); },
  remove(name){ this.removeRaw(this.prefix + name); },
  getJSON(name, fb){ return this.getRawJSON(this.prefix + name, fb); },
  setJSON(name, obj){ return this.setRawJSON(this.prefix + name, obj); },
  clearAll(){ this.KEYS.forEach(k => this.remove(k)); },
};

// ---------------- Tai khoan Google (khong bat buoc) ----------------
// Dan "Client ID" lay tu Google Cloud Console vao giua 2 dau nhay de bat nut dang nhap.
const GOOGLE_CLIENT_ID = "sk-ee7df56bb688455f97e03479af5d0754";
const Account = {
  user: null,
  init(){
    const u = Store.getRawJSON('miu_account', null);
    if (u && u.sub){
      this.user = u;
      Store.setPrefix('miu_u_' + u.sub + '_');
      this.adoptGuestData();
    }
  },
  // Lan dau dang nhap: neu tai khoan chua co du lieu thi nhan du lieu cua che do khach
  adoptGuestData(){
    if (Store.get('chats') !== null) return;
    Store.KEYS.forEach(k => { const v = Store.getRaw('miu_' + k); if (v !== null) Store.set(k, v); });
  },
  parseJwt(jwt){
    try {
      const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return null; }
  },
  // Luu y: chi dung de hien thi va tach du lieu theo tai khoan, chua phai xac thuc phia may chu
  onCredential(resp){
    const p = Account.parseJwt(resp && resp.credential);
    const okIss = p && (p.iss === 'https://accounts.google.com' || p.iss === 'accounts.google.com');
    if (!p || !okIss || p.aud !== GOOGLE_CLIENT_ID || !p.sub || (p.exp && p.exp * 1000 < Date.now())){
      addBubble("Đăng nhập Google chưa thành công, bạn thử lại nhé.", "miu", false);
      return;
    }
    Store.setRawJSON('miu_account', { sub: p.sub, name: p.name || p.email || '', email: p.email || '', picture: p.picture || '' });
    location.reload();
  },
  signOut(){
    Store.removeRaw('miu_account');
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    location.reload();
  },
};
Account.init();

const GREETING = "Chào bạn! Mình là Miu 🐾 Gõ \"help\" để xem mình làm được gì nhé.";
const MAX_CHATS = 50;
let chats = {};
let currentId = null;
let history = [];
let busy = false;
let busySince = 0;
function isBusy(){ return busy && (Date.now() - busySince) < 120000; } // tu mo khoa sau 2 phut neu bi treo
let liveActive = false;
let waitingForReply = false;
let recognition = null;
let apiKey = Store.get('api_key', '');
apiKeyInput.value = apiKey;
let deepMode = Store.get('deep') === '1';
deepBtn.classList.toggle('active', deepMode);
let attachments = [];
let provider = Store.get('provider', 'gemini');
let deepseekKey = Store.get('deepseek_key', '');
providerSelect.value = provider;
deepseekKeyInput.value = deepseekKey;

// ---------------- Nhieu cuoc tro chuyen (chat) ----------------
function makeTitle(text){
  let t = String(text).split('\n')[0].replace(/^📎\s*/, '').trim();
  if (!t) t = 'Chat mới';
  return t.length > 30 ? t.slice(0, 30).trimEnd() + '…' : t;
}
function newChatObj(){
  const id = 'c' + Date.now() + Math.floor(Math.random() * 1000);
  return { id, title: null, history: [{ who: 'miu', text: GREETING }], updated: Date.now() };
}
function persistChats(){
  const out = {};
  Object.values(chats).forEach(c => {
    out[c.id] = { id: c.id, title: c.title, updated: c.updated, history: c.history.slice(-60) };
  });
  Store.setJSON('chats', out);
  Store.set('current', currentId);
}
function loadChats(){
  const saved = Store.getJSON('chats', null);
  if (saved && Object.keys(saved).length){
    chats = saved;
    currentId = Store.get('current');
    if (!chats[currentId]){
      currentId = Object.values(chats).sort((a, b) => b.updated - a.updated)[0].id;
    }
  } else {
    // Lan dau co tinh nang nhieu chat: chuyen lich su cu thanh chat dau tien
    const c = newChatObj();
    const old = Store.getJSON('history', []);
    if (old.length){
      c.history = old;
      const u = old.find(m => m.who === 'user');
      if (u) c.title = makeTitle(u.text);
    }
    chats[c.id] = c;
    currentId = c.id;
  }
  history = chats[currentId].history;
  persistChats();
}
function saveHistory(){
  if (chats[currentId]) chats[currentId].updated = Date.now();
  persistChats();
}
function updateTitleUI(){
  chatTitleEl.textContent = (chats[currentId] && chats[currentId].title) || 'Chat mới';
}

function addBubble(text, who, store = true){
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (store){
    history.push({who, text});
    const cur = chats[currentId];
    if (who === 'user' && cur && !cur.title){
      cur.title = makeTitle(text);
      updateTitleUI();
    }
    saveHistory();
  }
  if (who === 'miu' && liveActive){
    waitingForReply = false;
    speakText(text);
  }
  return div;
}

function renderChat(){
  const was = liveActive;
  liveActive = false; // khong doc to lai tin nhan cu
  chatEl.textContent = '';
  history.forEach(m => addBubble(m.text, m.who, false));
  liveActive = was;
  chatEl.scrollTop = chatEl.scrollHeight;
  updateTitleUI();
}

function renderChatList(){
  chatListEl.textContent = '';
  Object.values(chats).sort((a, b) => b.updated - a.updated).forEach(c => {
    const row = document.createElement('div');
    row.className = 'chat-item' + (c.id === currentId ? ' active' : '');
    const t = document.createElement('span');
    t.className = 'chat-title';
    t.textContent = c.title || 'Chat mới';
    t.onclick = () => switchChat(c.id);
    const d = document.createElement('button');
    d.textContent = '🗑';

function switchChat(id){

  if (isBusy()){ warnBusy(); return; }
  currentId = id;
  history = chats[id].history;
  persistChats();

function newChat(){
  if (isBusy()){ warnBusy(); return; }
  closeDrawer();
  const cur = chats[currentId];
  if (cur && !cur.history.some(m => m.who === 'user')) return; // chat hien tai con trong, dung lai
  const oldest = Object.values(chats).filter(c => c.id !== currentId).sort((a, b) => a.updated - b.updated);
  while (Object.keys(chats).length >= MAX_CHATS && oldest.length) delete chats[oldest.shift().id];
  const c = newChatObj();
  chats[c.id] = c;
  currentId = c.id;
  history = c.history;
  persistChats();
  renderChat();
}
function deleteChat(id){
  if (isBusy()){ warnBusy(); return; }
  if (!confirm('Xoá cuộc trò chuyện này?')) return;
  delete chats[id];
  if (!Object.keys(chats).length){
    const c = newChatObj();
    chats[c.id] = c;
  }
  if (!chats[currentId]){
    currentId = Object.values(chats).sort((a, b) => b.updated - a.updated)[0].id;
    history = chats[currentId].history;
    renderChat();
  }
  persistChats();
  renderChatList();
}

function generatePassword(length){
  length = Math.max(6, Math.min(length || 12, 64));
  const lower = "abcdefghijklmnopqrstuvwxyz";
  const upper = lower.toUpperCase();
  const digits = "0123456789";
  const symbols = "!@#$%^&*()-_=+";
  const all = lower + upper + digits + symbols;
  function pick(set){ return set[crypto.getRandomValues(new Uint32Array(1))[0] % set.length]; }
  let pass = [pick(lower), pick(upper), pick(digits)];
  while (pass.length < length) pass.push(pick(all));
  // xao thu tu cho ngau nhien
  for (let i = pass.length - 1; i > 0; i--){
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [pass[i], pass[j]] = [pass[j], pass[i]];
  }
  return pass.join('');
}

let countdownTimer = null;
function startCountdown(seconds){
  seconds = Math.max(1, Math.min(seconds || 10, 300));
  if (countdownTimer) clearInterval(countdownTimer);

  let n = seconds;
  countdownTimer = setInterval(() => {

    if (n < 0){
      clearInterval(countdownTimer);
      countdownTimer = null;
      addBubble("Hết giờ rồi! ⏰", "miu");
    }
  }, 1000);
}

// ---------------- Game 5: Noi tu ----------------
const WORDCHAIN_WORDS = [
  "an", "anh", "ao", "ba", "banh", "bo", "buom", "ca", "canh", "cam",
  "cao", "cho", "com", "da", "dau", "de", "dua", "em", "en", "ga",
  "gao", "gau", "gio", "ho", "hoa", "hoc", "im", "it", "keo", "khe",
  "khoa", "la", "lop", "lua", "meo", "mit", "mua", "nai", "nam", "nang",
  "nem", "no", "oc", "oi", "ong", "phao", "pho", "phu", "quat", "qua",
  "quen", "ran", "rau", "re", "sao", "sen", "sung", "suoi", "tam", "tao",
  "tho", "tom", "tra", "tre", "tu", "uot", "uyen", "vang", "vit", "vo",
  "xanh", "xe", "xoi", "y", "yeu",
];
let wordChainGame = { active:false, used:new Set(), lastLetter:null };

function wcFindContinuation(letter){
  const candidates = WORDCHAIN_WORDS.filter(w => {
    const n = stripDiacritics(w).toLowerCase();
    return n[0] === letter && !wordChainGame.used.has(n);
  });
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function wordchainStart(){
  const first = WORDCHAIN_WORDS[Math.floor(Math.random() * WORDCHAIN_WORDS.length)];
  const norm = stripDiacritics(first).toLowerCase();
  wordChainGame = { active:true, used:new Set([norm]), lastLetter: norm.slice(-1) };
  addBubble(`Chơi nối từ nhé! Mình đi trước: "${first}".\nBạn nói 1 từ (không dấu cách) bắt đầu bằng chữ "${wordChainGame.lastLetter}" đi! (Gõ "thoat game 5" để dừng chơi)`, "miu");
}

function wordchainGuess(raw){
  const word = raw.trim();
  if (!word || word.includes(' ')){
    addBubble(`Bạn gõ 1 từ duy nhất thôi nhé (không có dấu cách), bắt đầu bằng chữ "${wordChainGame.lastLetter}".`, "miu");
    return;
  }
  const norm = stripDiacritics(word.toLowerCase());
  if (norm[0] !== wordChainGame.lastLetter){
    wordChainGame.active = false;
    addBubble(`Từ phải bắt đầu bằng chữ "${wordChainGame.lastLetter}" chứ! Bạn thua rồi, gõ "game 5" để chơi lại nhé.`, "miu");
    return;
  }
  if (wordChainGame.used.has(norm)){
    wordChainGame.active = false;
    addBubble(`Từ "${word}" dùng rồi nè, bạn thua rồi! Gõ "game 5" để chơi lại.`, "miu");
    return;
  }
  wordChainGame.used.add(norm);
  const nextLetter = norm.slice(-1);
  const continuation = wcFindContinuation(nextLetter);
  if (!continuation){
    wordChainGame.active = false;
    addBubble(`Mình chịu thua, không nghĩ ra từ nào bắt đầu bằng chữ "${nextLetter}" nữa! Bạn thắng!`, "miu");
    return;
  }
  wordChainGame.used.add(stripDiacritics(continuation).toLowerCase());
  wordChainGame.lastLetter = stripDiacritics(continuation).toLowerCase().slice(-1);
  addBubble(`"${continuation}". Tới lượt bạn, từ bắt đầu bằng chữ "${wordChainGame.lastLetter}" nhé!`, "miu");
}

function wordchainStop(){
  if (!wordChainGame.active){ addBubble("Đâu có đang chơi nối từ đâu.", "miu"); return; }
  wordChainGame.active = false;
  addBubble("Đã dừng chơi nối từ.", "miu");
}

const has = (t, ...keys) => keys.some(k => t.includes(k));
const firstNumber = (t, fallback) => { const m = t.match(/\d+/); return m ? parseInt(m[0], 10) : fallback; };
const COMMANDS = [
  { match: t => t === 'help' || t === 'tro giup', run: () => addBubble(HELP_TEXT, "miu") },

  { match: t => has(t, 'dem nguoc'), run: t => startCountdown(firstNumber(t, 10)) },
  // Lenh TAT dat truoc lenh BAT vi "tat nhac uong nuoc" cung chua chuoi con "nhac uong nuoc"
  { match: t => has(t, 'tat nhac uong nuoc', 'dung nhac uong nuoc', 'thoat nhac uong nuoc'), run: () => stopWaterReminder() },
  { match: t => has(t, 'nhac uong nuoc', 'bat nhac uong nuoc'), run: t => startWaterReminder(t) },
  { match: t => has(t, 'thoat game 4', 'dung game 4', 'huy game 4'), run: () => animalStop() },
  { match: t => has(t, 'game 4', 'doan con vat'), run: () => animalStart() },
  { match: t => has(t, 'thoat game 5', 'dung game 5', 'huy game 5'), run: () => wordchainStop() },
  { match: t => has(t, 'game 5', 'noi tu'), run: () => wordchainStart() },
];
function handleLocalCommand(raw){
  const text = stripDiacritics(raw.toLowerCase()).trim();
  const cmd = COMMANDS.find(c => c.match(text));
  if (!cmd) return false;
  cmd.run(text);
  return true;
}

// ---------------- Dinh kem tep / anh / chup anh ----------------
const MAX_ATTACH = 4;
const TEXT_EXTS = ['txt','md','csv','json','js','ts','py','html','css','xml','log','yml','yaml','java','c','cpp','h','sh','sql','ini','tsv'];

function readAsBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}
function readAsText(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result));
    r.onerror = () => reject(r.error);
    r.readAsText(file);
  });
}
// Thu nho anh (toi da 1280px) de gui nhanh va nhe
function loadImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      resolve({ mime: 'image/jpeg', data: dataUrl.split(',')[1], thumb: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}

async function addFiles(fileList){
  for (const file of Array.from(fileList)){
    if (attachments.length >= MAX_ATTACH){
      addBubble(`Mỗi lần mình chỉ nhận tối đa ${MAX_ATTACH} tệp thôi nhé.`, "miu", false);
      break;
    }
    const name = file.name || 'tep';
    const ext = (name.split('.').pop() || '').toLowerCase();
    try {
      if (file.type.startsWith('image/')){
        const img = await loadImage(file);
        attachments.push({ name, kind:'image', mime:img.mime, data:img.data, thumb:img.thumb });
      } else if (file.type === 'application/pdf' || ext === 'pdf'){
        if (file.size > 10 * 1024 * 1024){
          addBubble(`Tệp PDF "${name}" lớn quá (trên 10MB), bạn chọn tệp nhỏ hơn nhé.`, "miu", false);
          continue;
        }
        attachments.push({ name, kind:'pdf', mime:'application/pdf', data: await readAsBase64(file) });
      } else if (file.type.startsWith('text/') || TEXT_EXTS.includes(ext)){
        let t = await readAsText(file);
        if (t.length > 60000) t = t.slice(0, 60000) + '\n...(đã cắt bớt vì quá dài)';
        attachments.push({ name, kind:'text', text:t });
      } else {
        addBubble(`Mình chưa đọc được loại tệp "${name}". Hiện đọc được ảnh, PDF và tệp văn bản (txt, md, csv, json, code...).`, "miu", false);
      }
    } catch (e){
      addBubble(`Không đọc được tệp "${name}", bạn thử lại nhé.`, "miu", false);
    }
  }
  renderAttachments();
}

    ? "Đã bật suy nghĩ sâu 🧠: mình sẽ trả lời lâu hơn nhưng kỹ hơn (Gemini còn tìm thêm nguồn trên mạng)."
    : "Đã tắt suy nghĩ sâu.", "miu", false);
};

// ---------------- Goi AI cho cac cau hoi tu do ----------------
// Lich su gui cho AI: bo tin nhan nguoi dung vua gui (se them rieng kem tep dinh kem)
function historyForModel(){
  const h = history.filter(m => m.who === 'user' || m.who === 'miu').slice(-13);
  if (h.length && h[h.length - 1].who === 'user') h.pop();
  return h.slice(-12);
}
function attachedTextBlock(atts){
  return atts.filter(a => a.kind === 'text')
    .map(a => `\n\n[Nội dung tệp ${a.name}]\n${a.text}`).join('');
}
function thinkingText(){
  return deepMode ? "Miu đang suy nghĩ sâu... (có thể mất khá lâu)" : "Miu đang gõ...";
}

class ProviderError extends Error {
  constructor(userMessage){ super(userMessage); this.userMessage = userMessage; }
}

// Chi cho phep lien ket http(s), chan kieu "javascript:" tu du lieu ben ngoai
function safeHttpUrl(u){ return typeof u === 'string' && /^https?:\/\//i.test(u); }

function appendSources(bubble, sources){
  const links = sources.filter(w => w && safeHttpUrl(w.uri));
  if (!links.length) return;
  const box = document.createElement('div');
  box.className = 'sources';
  box.appendChild(document.createTextNode('Nguồn: '));
  links.forEach((w, i) => {
    if (i) box.appendChild(document.createTextNode(' · '));
    const a = document.createElement('a');
    a.href = w.uri; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = w.title || w.uri;
    box.appendChild(a);
  });
  bubble.appendChild(box);
}

// Goi Gemini: khoa gui qua header (khong nam tren dia chi URL); tu thu lai neu qua tai (503) hoac bi gioi han tam thoi (429)
async function geminiFetch(body){
  const base = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const post = (url, extra) => fetch(url, {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, extra),
    body: JSON.stringify(body),
  });
  let res, data;
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      res = await post(base, { 'x-goog-api-key': apiKey });
    } catch (e) {
      // Du phong: neu trinh duyet chan header tuy chinh thi dung cach cu (khoa tren URL)
      res = await post(base + '?key=' + encodeURIComponent(apiKey), {});
    }
    data = await res.json().catch(() => ({}));
    if (res.status !== 503 && res.status !== 429) break;
    await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
  }
  return { res, data };
}

// ----- Strategy: moi nha cung cap AI la 1 doi tuong cung giao dien ask(userText, atts) -> {text, sources} -----
const GeminiProvider = {
  networkMsg: "Không kết nối được tới Gemini. Kiểm tra lại mạng hoặc API key nhé.",
  async ask(userText, atts){
    if (!apiKey){
      throw new ProviderError("Bạn chưa lưu Gemini API key (bấm ⚙ góc trên để thêm) nên mình chỉ làm được các lệnh offline thôi. Gõ \"help\" xem danh sách nhé.");
    }
    const parts = [{ text: userText + attachedTextBlock(atts) }];
    atts.forEach(a => {
      if (a.kind === 'image' || a.kind === 'pdf') parts.push({ inlineData: { mimeType: a.mime, data: a.data } });
    });
    const contents = historyForModel().map(m => ({ role: m.who === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
    contents.push({ role: 'user', parts });
    const baseBody = {
      contents,
      systemInstruction: { parts: [{ text: SYSTEM_PERSONA + (deepMode ? DEEP_HINT : '') }] },
    };
    // Che do suy nghi sau: thu bat suy nghi + tim kiem; neu model khong ho tro thi ha dan
    const variants = deepMode ? [
      { search: true,  think: { thinkingLevel: 'high' } },
      { search: true,  think: { thinkingBudget: 8192 } },
      { search: true,  think: null },
      { search: false, think: null },
    ] : [{ search: false, think: null }];
    let result = null;
    for (const v of variants){
      const body = Object.assign({}, baseBody);
      if (v.search) body.tools = [{ google_search: {} }];
      if (v.think) body.generationConfig = { thinkingConfig: v.think };
      result = await geminiFetch(body);
      if (result.res.status !== 400) break;
    }
    const { res, data } = result;
    if (!res.ok){
      throw new ProviderError(`Lỗi gọi Gemini (${res.status}): ${data?.error?.message || 'không rõ nguyên nhân'}`);
    }
    const cand = data?.candidates?.[0];
    const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('')
      || "Mình chưa nghĩ ra câu trả lời, bạn hỏi lại giúp mình nhé.";
    const seen = new Set();
    const sources = (cand?.groundingMetadata?.groundingChunks || [])
      .map(c => c.web).filter(w => w && w.uri && !seen.has(w.uri) && seen.add(w.uri)).slice(0, 5);
    return { text, sources };
  },
};

const DeepseekProvider = {
  networkMsg: "Không kết nối được tới DeepSeek. Kiểm tra lại mạng hoặc API key nhé (hoặc trình duyệt đang chặn kết nối tới DeepSeek).",
  async ask(userText, atts){
    if (!deepseekKey){
      throw new ProviderError("Bạn chưa lưu DeepSeek API key (bấm ⚙ góc trên để thêm) nên mình chỉ làm được các lệnh offline thôi. Gõ \"help\" xem danh sách nhé.");
    }
    if (atts.some(a => a.kind !== 'text')){
      throw new ProviderError("DeepSeek chưa đọc được ảnh hoặc PDF. Bạn bấm ⚙ chọn Gemini để mình xem ảnh/PDF nhé.");
    }
    const sys = SYSTEM_PERSONA + (deepMode ? DEEP_HINT : '');
    const messages = [{ role: 'system', content: sys }]
      .concat(historyForModel().map(m => ({ role: m.who === 'user' ? 'user' : 'assistant', content: m.text })))
      .concat([{ role: 'user', content: userText + attachedTextBlock(atts) }]);
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + deepseekKey,
      },
      body: JSON.stringify({
        model: DEEPSEEK_MODEL,
        messages,
        thinking: { type: deepMode ? 'enabled' : 'disabled' },
        stream: false,
      }),
    });
    const data = await res.json();
    if (!res.ok){
      throw new ProviderError(`Lỗi gọi DeepSeek (${res.status}): ${data?.error?.message || 'không rõ nguyên nhân'}`);
    }
    const text = data?.choices?.[0]?.message?.content || "Mình chưa nghĩ ra câu trả lời, bạn hỏi lại giúp mình nhé.";
    return { text, sources: [] };
  },
};

const Providers = { gemini: GeminiProvider, deepseek: DeepseekProvider };

async function askMiu(userText, atts = []){
  busy = true;
  busySince = Date.now();
  const prov = Providers[provider] || GeminiProvider;
  const thinking = addBubble(thinkingText(), "miu typing", false);
  try {
    const out = await prov.ask(userText, atts);
    thinking.remove();
    const bubble = addBubble(out.text, "miu");
    if (out.sources && out.sources.length) appendSources(bubble, out.sources);
  } catch (err){
    thinking.remove();
    addBubble(err instanceof ProviderError ? err.userMessage : prov.networkMsg, "miu");
  } finally {
    busy = false;
  }
}

const RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
if (RecognitionCtor){
  recognition = new RecognitionCtor();
  recognition.lang = 'vi-VN';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript.trim();
    if (transcript){
      waitingForReply = true;
      inputEl.value = transcript;
      send();
    }
  };
  recognition.onend = () => {
    if (liveActive && !waitingForReply && !speechSynthesis.speaking) startListening();
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed'){
      liveActive = false;
      liveBtn.classList.remove('active');
      addBubble("Mình chưa được cấp quyền dùng micro, bạn cho phép rồi bật lại Live nhé.", "miu", false);
      return;
    }
    if (liveActive && !waitingForReply) setTimeout(() => startListening(), 500);
  };
}

function startListening(){
  if (!recognition || !liveActive || waitingForReply) return;
  try { recognition.start(); } catch (e) { /* da dang chay, bo qua */ }
}

function speakText(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'vi-VN';
  utter.onend = () => { if (liveActive) startListening(); };
  speechSynthesis.speak(utter);
}

liveBtn.onclick = () => {
  if (!recognition){
    addBubble("Trình duyệt này chưa hỗ trợ live voice, bạn thử trên Chrome hoặc Edge nhé.", "miu", false);
    return;
  }
  liveActive = !liveActive;
  liveBtn.classList.toggle('active', liveActive);
  if (liveActive){
    addBubble("Đã bật chế độ live, bạn nói chuyện thoải mái nhé! 🎙️", "miu", false);
    startListening();
  } else {
    speechSynthesis.cancel();
    if (recognition) { try { recognition.stop(); } catch(e){} }
    addBubble("Đã tắt chế độ live.", "miu", false);
  }
};

function send(){
  const text = inputEl.value.trim();
  const atts = attachments.slice();
  if (!text && !atts.length) return;

  if (atts.length){
    // Co tep dinh kem: gui thang cho AI (bo qua lenh offline)
    const shown = (text ? text + '\n' : '') + atts.map(a => '📎 ' + a.name).join('\n');
    const bubble = addBubble(shown, "user");
    atts.filter(a => a.thumb).forEach(a => {
      const im = document.createElement('img');
      im.className = 'thumb';
      im.src = a.thumb;
      bubble.appendChild(im);
    });
    inputEl.value = '';
    attachments = [];
    renderAttachments();
    askMiu(text || 'Hãy xem tệp đính kèm này và cho mình biết nội dung chính, giải thích giúp mình nhé.', atts);
    return;
  }

  addBubble(text, "user");
  inputEl.value = '';

  if (handleLocalCommand(text)) return;

  askMiu(text);
}


sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Dang ky service worker de co the "Cai dat" thanh app va dung offline duoc 1 phan
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
